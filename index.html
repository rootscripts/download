      k = S.ease(Math.min(1, t / S.MORPH_MS));
      if (t >= S.MORPH_MS) { cur = nxt; phase = 0; t0 = now; k = 0; }
    }
    var A = S.profile(cur), B = phase ? S.profile(nxt) : A;
    var d = '';
    for (var i = 0; i < S.K; i++) {
      var th = -Math.PI + (Math.PI * 2 * i) / S.K;
      var rr = A[i] + (B[i] - A[i]) * k;
      d += (i ? 'L' : 'M') + (rr * Math.cos(th)).toFixed(1) + ' ' + (rr * Math.sin(th)).toFixed(1);
    }
    path.setAttribute('d', d + 'Z');
    rot.style.transform = 'rotate(' + deg.toFixed(1) + 'deg)';
    requestAnimationFrame(frame);
  }

  function start() {
    if (S && S.ready()) requestAnimationFrame(frame);
    run();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
